<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CatchUp</title>
    <meta
      name="description"
      content="CatchUp builds you one news feed around the topics you care about. Each story groups the outlets that reported it, and the feed learns from what you read."
    />
    <meta name="theme-color" content="#f9fafb" />
    <!-- Commons' sign-in code arrives in the address, so it must never be sent on to other sites. -->
    <meta name="referrer" content="no-referrer" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CatchUp" />
    <meta property="og:title" content="CatchUp: the news you care about, without the scrolling" />
    <meta
      property="og:description"
      content="One feed for your topics. Each story groups every outlet that reported it, and stories you've read don't come back."
    />

    <!-- Made from a screenshot of the CatchUp logo. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
